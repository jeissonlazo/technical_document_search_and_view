name: technical-docs

x-backend: &backend
  image: technical-docs-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file:
    - .env
  init: true

services:
  # Opcional para desarrollo sin Neon.
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: docs
      POSTGRES_PASSWORD: docs
      POSTGRES_DB: docs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docs -d docs"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  # Migra la base Neon (o Postgres local) antes de arrancar API/worker.
  migrate:
    <<: *backend
    command:
      [
        "./node_modules/.bin/prisma",
        "migrate",
        "deploy",
        "--schema",
        "prisma/schema.prisma"
      ]
    restart: "no"

  api:
    <<: *backend
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    <<: *backend
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      ELASTICSEARCH_NODE: http://elasticsearch:9200
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  frontend:
    image: technical-docs-frontend
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Uso puntual: docker compose --profile seed run --rm seed
  seed:
    <<: *backend
    profiles: ["seed"]
    command: ["./node_modules/.bin/tsx", "prisma/seed.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Reconstruye el índice de búsqueda con el mapeo actual y mueve el alias.
  # docker compose --profile search-index run --rm es-reindex
  # Otro destino:
  # docker compose --profile search-index run --rm es-reindex ./node_modules/.bin/tsx scripts/reindex.ts documents-v3
  es-reindex:
    <<: *backend
    profiles: ["search-index"]
    environment:
      ELASTICSEARCH_NODE: http://elasticsearch:9200
    command: ["./node_modules/.bin/tsx", "scripts/reindex.ts"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  es_data:
