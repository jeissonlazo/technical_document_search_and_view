server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 110m;

  error_page 413 = @payload_too_large;
  location @payload_too_large {
    default_type application/json;
    return 413 '{"code":"FILE_TOO_LARGE","message":"La carga supera el límite permitido por el servidor.","retryable":false}';
  }

  # Docker DNS: re-resuelve "api" si el contenedor se recrea.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/events {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Accel-Buffering no;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
  }

  # PDF.js carga su worker como módulo ES.
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
